name: Publish Proto Package
on:
  push:
    branches:
      - main
jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: packages/etu-proto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: packages/etu-proto/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@icco'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Generate and build
        run: npm run build
      - name: Set version from date
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          # Patch = DDHHMMSS so it strictly increases within each YEAR.MONTH.
          # Max value 31235959 fits inside a semver numeric identifier.
          PATCH=$((10#$(date -u +%d) * 1000000 + 10#$(date -u +%H%M%S)))
          VERSION="${YEAR}.${MONTH}.${PATCH}"

          # Safety net: if the registry already has a version >= computed
          # (clock skew, manual rerun, month rollback), bump above it.
          PKG_NAME=$(node -p "require('./package.json').name")
          LATEST=$(npm view "$PKG_NAME" version 2>/dev/null || true)
          if [ -n "$LATEST" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$LATEST" | sort -V | tail -n1)
            if [ "$VERSION" = "$LATEST" ] || [ "$HIGHEST" != "$VERSION" ]; then
              LY=$(echo "$LATEST" | cut -d. -f1)
              LM=$(echo "$LATEST" | cut -d. -f2)
              LP=$(echo "$LATEST" | cut -d. -f3)
              VERSION="${LY}.${LM}.$((LP + 1))"
              echo "Computed version not greater than latest ($LATEST); bumping to $VERSION"
            fi
          fi

          npm version "$VERSION" --no-git-tag-version
          echo "Publishing version: $VERSION"
      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
